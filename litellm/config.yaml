model_list:

  # --- Уровень 1: проприетарное облако ---
  - model_name: smart
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: smart-gpt
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY

  # --- Уровень 2: открытые веса в облаке ---
  - model_name: open-cloud
    litellm_params:
      model: openrouter/qwen/qwen3-coder-480b
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: open-cloud-alt
    litellm_params:
      model: openrouter/z-ai/glm-5
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Уровень 3: открытые веса дома ---
  - model_name: local
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: os.environ/OLLAMA_HOST_URL

  - model_name: local-small
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_HOST_URL

router_settings:
  # Деградация в два шага: Claude -> открытые веса в облаке -> локально
  fallbacks:
    - smart: ["open-cloud", "open-cloud-alt", "local"]
    - smart-gpt: ["open-cloud", "local"]
    - open-cloud: ["open-cloud-alt", "local"]
    - local: ["local-small"]
  num_retries: 2
  timeout: 120

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
