schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: ai-workspace — единое пространство для Claude Code, Codex и OpenCode
  (скилы, агенты, персоны, правила, MCP) и шлюз к моделям LiteLLM.

  Главная цель — независимость. Если любой провайдер харнесса или моделей отключит
  доступ (страна, паспорт, просто решение вендора), работа над простыми проектами
  продолжается без перерыва. Каждое решение проверяется вопросом: что останется,
  если это звено пропадёт?

  Железные правила:
  1. Источник правды — git этого репо. В папки инструментов ничего руками не кладётся,
     всё раскладывает scripts/sync-agents.py.
  2. Секреты только в .env. Конфиги инструментов ссылаются на переменные, не на значения.
  3. Открытое предпочтительнее закрытого. Закрытый компонент допустим только рядом
     с открытой заменой и не на критическом пути.
  4. Платная модель не включается без спроса: бесплатное падает только на бесплатное
     или локальное.
  5. Последнее звено цепочки моделей работает без интернета.
  6. Без Docker на основном пути. Docker — только для необязательного Open WebUI.

  Железо: Mac на M4, 16 ГБ. Модели и офлайн-комплект — на внешнем SSD
  «Samsung T7 Shield» (/Volumes/Samsung T7 Shield).

